version: '3.8'

services:
  # AI Model Service (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: emergency-ai
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Download AI Model (runs once)
  setup-ai:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    command: >
      sh -c "
      sleep 10
      ollama pull llama2:7b
      echo 'AI model ready!'
      "

  # Primary Backend API (Port 8000)
  backend-primary:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: emergency-backend-8000
    ports:
      - "8000:8000"
    depends_on:
      - setup-ai
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    restart: unless-stopped

  # Secondary Backend API (Port 8001)
  backend-secondary:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: emergency-backend-8001
    ports:
      - "8001:8000"
    depends_on:
      - setup-ai
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    restart: unless-stopped

  # Tertiary Backend API (Port 8002)
  backend-tertiary:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: emergency-backend-8002
    ports:
      - "8002:8000"
    depends_on:
      - setup-ai
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    restart: unless-stopped

volumes:
  ollama_data: